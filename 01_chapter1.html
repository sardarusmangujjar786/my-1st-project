<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>www.FoodOrder.com</title>
    <style>
        /* Remove default browser spacing */
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

/* Main page */
body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    min-height: 100vh;
    text-align: center;
    padding-top: 80px;
}

/* Main heading */
h1 {
    color: #d62828;
    font-size: 42px;
    margin-bottom: 45px;
    text-transform: uppercase;
    letter-spacing: 1px;
}

/* Restaurant links */
a {
    display: inline-block;
    width: 220px;
    padding: 20px 25px;
    margin: 15px;
    
    background: white;
    color: #222;
    text-decoration: none;
    
    font-size: 22px;
    font-weight: bold;
    
    border-radius: 12px;
    border: 2px solid #d62828;
    
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.15);
    
    transition: all 0.3s ease;
}

/* Mouse hover effect */
a:hover {
    background: #d62828;
    color: white;
    transform: translateY(-8px);
    box-shadow: 0 10px 25px rgba(0, 0, 0, 0.25);
}

/* Copyright */
p1 {
    display: block;
    margin-top: 80px;
    padding: 20px;
    
    background: #222;
    color: white;
    
    font-size: 15px;
}
    </style>
</head>
<body>
    <H1>For Food Choose Your Restaurant</H1>
    <a href="https://www.mcdonalds.com/us/en-us/full-menu.html" target="_blank">Mcdonald's</a>
    <a href="https://www.kfcpakistan.com/login/" target="_blank">KFC</a>
    <a href="https://www.cheezious.com/" target="_blank">Cheezious</a>
    <a href="https://www.dominos.com.pk/" target="_blank">Domino's</a>
    <p1>All Copyrights Reserved</p1>
</body>
</html>>
